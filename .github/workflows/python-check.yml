name: Python code check

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: flake8 and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install \
            flake8==5.0.4 \
            flake8-docstrings==1.7.0 \
            pep8-naming==0.13.3

      - name: Check code style with flake8
        run: flake8 .

      - name: Byte-compile sources
        run: python -m compileall -q lab1

      - name: Run unit tests
        run: python -m unittest discover -s lab1/tests -t .
